    <script type="module">
        import { GestureRecognizer, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // --- CONFIGURARE ---
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d');
        
        let APP_MODE = 'LEARN'; 
        let INPUT_MODE = 'AUTO'; 
        let currentLevelIdx = 0; 
        let CELL_SIZE = 30; 
        let GRID_SIZE = 15; 
        let speed = 300;
        let kang = { x: 0, y: 0, dir: 1, trace: [] }; 
        let isRunning = false; 
        let abortController = false; 
        let procedures = {};

        // --- VARIABILE AI (VISION) ---
        let gestureRecognizer;
        let runningMode = "VIDEO";
        let webcamRunning = false;
        let lastVideoTime = -1;
        let currentGesture = "";
        let gestureStartTime = 0;
        let lastActionTime = 0;
        const REPEAT_DELAY = 1000; // 1 sec pt confirmare
        const REPEAT_RATE = 2000;  // 2 sec pauza

        // --- VARIABILE AI (VOICE) ---
        let recognition;
        let isVoiceOn = false;

        // --- INIT ---
        window.onload = function() {
            window.clearCode();
            window.switchAppMode('LEARN');
            document.getElementById('speedRange').addEventListener('input', (e) => speed = 1010 - e.target.value);
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') if (INPUT_MODE === 'AUTO') window.runProgram();
            });
            window.addEventListener('resize', window.resizeCanvas);
            
            initVisionAI();
            initVoiceAI();
        };

        // ------------------ 1. VISION AI (MediaPipe) ------------------
        const initVisionAI = async () => {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
                    delegate: "GPU"
                },
                runningMode: runningMode
            });
            const st = document.getElementById('gestureStatus');
            if(st) st.innerText = "Camera Pregătită";
        };

        window.toggleCamera = async () => {
            const feed = document.getElementById('cameraFeed');
            const toggle = document.getElementById('cameraToggle');
            const video = document.getElementById('webcam');
            
            if (toggle.checked) {
                if (!gestureRecognizer) { alert("AI Vision încă se încarcă..."); toggle.checked = false; return; }
                feed.classList.remove('hidden');
                webcamRunning = true;
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                await video.play();
                requestAnimationFrame(predictWebcam);
            } else {
                webcamRunning = false;
                feed.classList.add('hidden');
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            }
        };

        async function predictWebcam() {
            const video = document.getElementById('webcam');
            const status = document.getElementById('gestureStatus');
            if (!webcamRunning) return;

            let now = Date.now();
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (video.videoWidth > 0) {
                    const results = gestureRecognizer.recognizeForVideo(video, now);
                    if (results.gestures.length > 0) {
                        const gesture = results.gestures[0][0];
                        if (gesture.score > 0.5) {
                            processGesture(gesture.categoryName, now, status);
                        }
                    } else {
                        resetGesture();
                        status.innerText = "Caut mâna...";
                        status.style.color = "white";
                    }
                }
            }
            if (webcamRunning) window.requestAnimationFrame(predictWebcam);
        }

        function processGesture(name, now, statusElem) {
            if (name !== currentGesture) { currentGesture = name; gestureStartTime = now; }
            statusElem.innerText = `Detectat: ${name}`;
            statusElem.style.color = "#fbbf24"; 

            if (now - gestureStartTime > REPEAT_DELAY) {
                if (lastActionTime === 0 || (now - lastActionTime > REPEAT_RATE)) {
                    statusElem.style.color = "#4ade80"; 
                    executeCommand(name, 'GEST');
                    lastActionTime = now;
                } else {
                    statusElem.innerText = "Așteaptă...";
                    statusElem.style.color = "#9ca3af";
                }
            }
        }

        function resetGesture() { currentGesture = ""; gestureStartTime = 0; }

        // ------------------ 2. VOICE AI (Web Speech API) ------------------
        const initVoiceAI = () => {
            if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'ro-RO';
                recognition.continuous = true;
                recognition.interimResults = false;

                recognition.onresult = (event) => {
                    const last = event.results.length - 1;
                    const command = event.results[last][0].transcript.toLowerCase().trim();
                    showNotification(`Voce: "${command}"`);
                    processVoiceCommand(command);
                };

                recognition.onend = () => { if (isVoiceOn) recognition.start(); };
            } else {
                document.getElementById('btnMic').innerText = "❌ Browser Incompatibil";
            }
        };

        window.toggleVoice = () => {
            const btn = document.getElementById('btnMic');
            if (!isVoiceOn) {
                recognition.start();
                isVoiceOn = true;
                btn.innerText = "🛑 STOP MICROFON";
                btn.classList.add('mic-active');
            } else {
                recognition.stop();
                isVoiceOn = false;
                btn.innerText = "🎙️ START MICROFON";
                btn.classList.remove('mic-active');
            }
        };

        function processVoiceCommand(cmd) {
            // MAPPING PENTRU VOCE
            if (cmd.includes("pas")) executeCommand("Closed_Fist", 'VOCE');
            else if (cmd.includes("rotire") || cmd.includes("rotește")) executeCommand("Open_Palm", 'VOCE');
            else if (cmd.includes("salt") || cmd.includes("sari")) executeCommand("Victory", 'VOCE');
            else if (cmd.includes("start") || cmd.includes("execută")) executeCommand("Thumb_Up", 'VOCE');
            else if (cmd.includes("șterge") || cmd.includes("sterge")) executeCommand("Thumb_Down", 'VOCE');
        }

        // --- COMMAND CENTER (Vision + Voice) ---
        function executeCommand(type, source) {
            let txt = "";
            let action = null;

            // 1. PUMN = PAS
            if (type === "Closed_Fist") { txt="PAS ⬆"; action = () => window.handleAction('Pas'); }
            // 2. PALMA = ROTIRE
            else if (type === "Open_Palm") { txt="ROTIRE ↻"; action = () => window.handleAction('Rotire'); }
            // 3. VICTORY = SALT
            else if (type === "Victory") { txt="SALT 🐇"; action = () => window.handleAction('Salt'); }
            // 4. LIKE = START
            else if (type === "Thumb_Up") { 
                txt="EXECUTĂ! ▶"; 
                action = () => { window.runProgram(); speak("Pornesc la drum!"); }; 
            }
            // 5. DISLIKE = RESET
            else if (type === "Thumb_Down") { 
                txt="RESET TOTAL! 🧹"; 
                action = () => { window.clearCode(); window.resetApp(); speak("Am șters tot."); }; 
            }

            if (action) {
                showNotification(`${source}: ${txt}`);
                action();
            }
        }

        function showNotification(msg) {
            const n = document.getElementById('aiMsg');
            const box = document.getElementById('aiNotification');
            n.innerText = msg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 2000);
        }

        function speak(text) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'ro-RO';
            window.speechSynthesis.speak(u);
        }

        // --- INSERT FIX ---
        window.insertText = (text) => {
            const editor = document.getElementById('codeEditor');
            let code = editor.value;
            const endIdx = code.lastIndexOf("END");
            if (endIdx === -1) { editor.value += "\n" + text; return; }
            let beforeEnd = code.substring(0, endIdx);
            if (!beforeEnd.endsWith('\n')) beforeEnd += "\n";
            editor.value = beforeEnd + text + "\n" + code.substring(endIdx);
            editor.scrollTop = editor.scrollHeight;
        };

        // --- STANDARD LOGIC ---
        window.handleAction = (act) => {
            if (INPUT_MODE === 'MANUAL') {
                if (act === 'Pas') window.move('pas');
                if (act === 'Rotire') { kang.dir = (kang.dir + 1) % 4; window.draw(); }
                if (act === 'Salt') window.move('salt');
            } else window.insertText(act);
        };

        const LEVELS = [
            { id: 1, grid: 8, start: {x: 0, y: 0, dir: 1}, goal: {x: 4, y: 0}, walls: [] },
            { id: 2, grid: 8, start: {x: 0, y: 0, dir: 1}, goal: {x: 2, y: 2}, walls: [] },
            { id: 3, grid: 10, start: {x: 0, y: 0, dir: 2}, goal: {x: 4, y: 4}, walls: [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:2,y:2}] },
            { id: 4, grid: 12, start: {x: 1, y: 1, dir: 1}, goal: {x: 8, y: 8}, walls: [{x:4,y:4},{x:4,y:5},{x:4,y:6},{x:5,y:4}] },
            { id: 5, grid: 12, start: {x: 0, y: 5, dir: 1}, goal: {x: 11, y: 5}, walls: [{x:5,y:0},{x:5,y:1},{x:5,y:2},{x:5,y:3},{x:5,y:4},{x:5,y:6},{x:5,y:7},{x:5,y:8},{x:5,y:9},{x:5,y:10}] },
            { id: 6, grid: 15, start: {x: 1, y: 1, dir: 2}, goal: {x: 13, y: 1}, walls: [{x:1,y:3},{x:2,y:3},{x:3,y:3},{x:4,y:3},{x:5,y:3},{x:6,y:3},{x:7,y:3},{x:7,y:2},{x:7,y:1}] },
            { id: 7, grid: 15, start: {x: 7, y: 7, dir: 0}, goal: {x: 7, y: 0}, walls: [{x:6,y:5},{x:7,y:5},{x:8,y:5},{x:5,y:3},{x:9,y:3}] },
            { id: 8, grid: 15, start: {x: 0, y: 0, dir: 1}, goal: {x: 14, y: 14}, walls: [{x:2,y:0},{x:2,y:1},{x:2,y:2},{x:0,y:4},{x:1,y:4},{x:2,y:4},{x:3,y:4},{x:6,y:6},{x:7,y:6},{x:8,y:6},{x:10,y:10},{x:11,y:10},{x:12,y:10}] },
            { id: 9, grid: 15, start: {x: 0, y: 0, dir: 1}, goal: {x: 0, y: 4}, walls: [{x:1,y:0},{x:2,y:0},{x:3,y:0},{x:3,y:1},{x:3,y:2},{x:2,y:2},{x:1,y:2},{x:1,y:3},{x:1,y:4}] },
            { id: 10, grid: 15, start: {x: 7, y: 14, dir: 0}, goal: {x: 7, y: 0}, walls: [{x:0,y:7},{x:1,y:7},{x:2,y:7},{x:3,y:7},{x:4,y:7},{x:5,y:7},{x:9,y:7},{x:10,y:7},{x:11,y:7},{x:12,y:7},{x:13,y:7},{x:14,y:7}] },
            { id: 11, grid: 20, start: {x: 0, y: 0, dir: 1}, goal: {x: 19, y: 19}, walls: generateLine(5,0,5,15) },
            { id: 12, grid: 20, start: {x: 10, y: 10, dir: 0}, goal: {x: 0, y: 0}, walls: generateBox(8,8,4,4) },
            { id: 13, grid: 20, start: {x: 0, y: 10, dir: 1}, goal: {x: 20, y: 10}, walls: generateZigZag(20) },
            { id: 14, grid: 15, start: {x: 2, y: 2, dir: 1}, goal: {x: 12, y: 12}, walls: [{x:5,y:5},{x:6,y:5},{x:7,y:5},{x:8,y:5},{x:9,y:5},{x:5,y:6},{x:5,y:7},{x:5,y:8},{x:5,y:9}] },
            { id: 15, grid: 20, start: {x: 9, y: 9, dir: 0}, goal: {x: 0, y: 0}, walls: [] }
        ];

        function generateLine(x,y,len,v) { let a=[]; for(let i=0;i<len;i++) a.push(v?{x:x,y:y+i}:{x:x+i,y:y}); return a; }
        function generateBox(x,y,w,h) { let a=[]; for(let i=0;i<w;i++){a.push({x:x+i,y:y});a.push({x:x+i,y:y+h});} for(let i=0;i<h;i++){a.push({x:x,y:y+i});if(i!==h/2)a.push({x:x+w,y:y+i});} return a; }
        function generateZigZag(s) { let a=[]; for(let i=1;i<s;i+=2) a.push({x:i,y:10}); return a; }

        window.switchAppMode = (mode) => {
            APP_MODE = mode;
            if (mode === 'LEARN') {
                document.getElementById('btnAppLearn').classList.replace('mode-btn-inactive', 'mode-btn-active');
                document.getElementById('btnAppGame').classList.replace('mode-btn-active', 'mode-btn-inactive');
                document.getElementById('controlsLearn').classList.remove('hidden');
                document.getElementById('controlsGame').classList.add('hidden');
                window.resetApp();
            } else {
                document.getElementById('btnAppGame').classList.replace('mode-btn-inactive', 'mode-btn-active');
                document.getElementById('btnAppLearn').classList.replace('mode-btn-active', 'mode-btn-inactive');
                document.getElementById('controlsGame').classList.remove('hidden');
                document.getElementById('controlsLearn').classList.add('hidden');
                window.loadLevel(0);
            }
        };

        window.loadLevel = (idx) => {
            if (idx < 0) idx = 0; if (idx >= LEVELS.length) idx = LEVELS.length - 1;
            currentLevelIdx = idx;
            document.getElementById('levelDisplay').innerText = `Nivelul ${LEVELS[idx].id}`;
            document.getElementById('victoryModal').classList.add('hidden');
            window.resetApp();
        };
        window.nextLevel = () => window.loadLevel(currentLevelIdx + 1);
        window.prevLevel = () => window.loadLevel(currentLevelIdx - 1);
        window.nextLevelAndClose = () => window.loadLevel(currentLevelIdx + 1);

        window.resetApp = () => {
            abortController = true;
            document.getElementById('errorBox').classList.add('hidden');
            if (APP_MODE === 'LEARN') {
                GRID_SIZE = parseInt(document.getElementById('gridSizeSelect').value);
                kang = { x: 0, y: 0, dir: 1, trace: [] };
            } else {
                const lvl = LEVELS[currentLevelIdx];
                GRID_SIZE = lvl.grid;
                kang = { ...lvl.start, trace: [] };
            }
            window.resizeCanvas();
        };

        window.resizeCanvas = () => {
            const c = document.getElementById('canvasContainer');
            const maxW = c.clientWidth - 40; const maxH = c.clientHeight - 40;
            const g = APP_MODE === 'GAME' ? LEVELS[currentLevelIdx].grid + 1 : GRID_SIZE;
            CELL_SIZE = Math.floor(Math.min(maxW, maxH) / g);
            if(CELL_SIZE < 15) CELL_SIZE = 15;
            canvas.width = g * CELL_SIZE; canvas.height = g * CELL_SIZE;
            window.draw();
        };

        window.draw = () => {
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1; ctx.beginPath();
            const g = APP_MODE === 'GAME' ? LEVELS[currentLevelIdx].grid : GRID_SIZE;
            for(let i=0; i<=g; i++) { ctx.moveTo(i*CELL_SIZE,0); ctx.lineTo(i*CELL_SIZE,canvas.height); ctx.moveTo(0,i*CELL_SIZE); ctx.lineTo(canvas.width,i*CELL_SIZE); }
            ctx.stroke();

            if (APP_MODE === 'GAME') {
                const lvl = LEVELS[currentLevelIdx];
                ctx.fillStyle = 'rgba(34, 197, 94, 0.2)'; ctx.fillRect(lvl.goal.x*CELL_SIZE, lvl.goal.y*CELL_SIZE, CELL_SIZE, CELL_SIZE);
                ctx.font = `${CELL_SIZE*0.6}px Arial`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("🏁", lvl.goal.x*CELL_SIZE+CELL_SIZE/2, lvl.goal.y*CELL_SIZE+CELL_SIZE/2);
                ctx.fillStyle = '#ef4444'; lvl.walls.forEach(w => ctx.fillRect(w.x*CELL_SIZE+2, w.y*CELL_SIZE+2, CELL_SIZE-4, CELL_SIZE-4));
            }

            ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = Math.max(3, CELL_SIZE/6); ctx.lineCap='round';
            if(kang.trace.length>0) {
                ctx.beginPath();
                kang.trace.forEach(s => { ctx.moveTo(s.x1*CELL_SIZE+CELL_SIZE/2, s.y1*CELL_SIZE+CELL_SIZE/2); ctx.lineTo(s.x2*CELL_SIZE+CELL_SIZE/2, s.y2*CELL_SIZE+CELL_SIZE/2); });
                ctx.stroke();
            }
            window.drawRobot(kang.x, kang.y, kang.dir);
            document.getElementById('debugX').innerText = kang.x; document.getElementById('debugY').innerText = kang.y;
        };

        window.drawRobot = (x, y, dir) => {
            const cx = x*CELL_SIZE+CELL_SIZE/2; const cy = y*CELL_SIZE+CELL_SIZE/2; const s = CELL_SIZE*0.7;
            ctx.save(); ctx.translate(cx, cy); ctx.rotate(dir*90*Math.PI/180);
            ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.beginPath(); ctx.moveTo(0,-s/2+2); ctx.lineTo(s/2+2,s/2+2); ctx.lineTo(0,s/3+2); ctx.lineTo(-s/2-2,s/2+2); ctx.fill();
            ctx.fillStyle = '#f97316'; ctx.beginPath(); ctx.moveTo(0,-s/2); ctx.lineTo(s/2,s/2); ctx.lineTo(0,s/3); ctx.lineTo(-s/2,s/2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,0,s/5,0,Math.PI*2); ctx.fill();
            ctx.restore();
        };

        window.askAI = async () => {
            const input = document.getElementById('aiInput').value.toLowerCase();
            if(!input) return;
            let code = "// AI: Mers Simplu\nPas\nPas";
            if(input.includes("patrat")) code = "// AI: Pătrat\nRepeta 4 [\n  Pas\n  Rotire\n]";
            if(input.includes("steag")) code = "// AI: Caută\nDaca MARGINE [\n  Rotire\n] Altfel [\n  Pas\n]";
            document.getElementById('codeEditor').value = "BEGIN\n" + code + "\nEND";
            const n = document.getElementById('aiNotification');
            n.classList.remove('hidden'); setTimeout(()=>n.classList.add('hidden'), 2000);
        };

        window.setInputMode = (mode) => {
            INPUT_MODE = mode;
            const ed = document.getElementById('codeEditor');
            const ov = document.getElementById('manualOverlay');
            if(mode === 'AUTO') {
                ed.readOnly = false; ov.classList.add('hidden');
                document.getElementById('btnInputAuto').classList.replace('text-gray-500','bg-indigo-600');
                document.getElementById('btnInputAuto').classList.add('text-white');
                document.getElementById('btnInputManual').classList.replace('bg-indigo-600','text-gray-500');
                document.getElementById('btnInputManual').classList.remove('text-white');
            } else {
                ed.readOnly = true; ov.classList.remove('hidden');
                document.getElementById('btnInputManual').classList.replace('text-gray-500','bg-indigo-600');
                document.getElementById('btnInputManual').classList.add('text-white');
                document.getElementById('btnInputAuto').classList.replace('bg-indigo-600','text-gray-500');
                document.getElementById('btnInputAuto').classList.remove('text-white');
            }
        };

        window.insertTemplate = (type) => {
             let t = ""; let off = 0;
             if (type === 'repeta') { t = "Repeta 4 [\n  \n]"; off = -2; }
             if (type === 'daca') { t = "Daca MARGINE [\n  Rotire\n] Altfel [\n  Pas\n]"; off = 0; }
             if (type === 'procedura') { t = "\nPROCEDURA Nume [\n  Pas\n]\n"; off = -8; }
             if (type === 'executa') { t = "Executa Nume"; off = 0; }
             window.insertText(t);
        };

        window.clearCode = () => { document.getElementById('codeEditor').value = "BEGIN\n\nEND"; };
        window.saveCode = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([document.getElementById('codeEditor').value], {type: "text/plain"})); a.download = "cangur.txt"; a.click(); };

        window.move = (type) => {
            if (canMove()) {
                let nx = kang.x, ny = kang.y;
                if (kang.dir === 0) ny--; if (kang.dir === 1) nx++; if (kang.dir === 2) ny++; if (kang.dir === 3) nx--;
                if (type === 'pas') kang.trace.push({x1:kang.x, y1:kang.y, x2:nx, y2:ny});
                kang.x = nx; kang.y = ny; window.draw(); checkWin();
            } else { canvas.style.borderColor = 'red'; setTimeout(() => canvas.style.borderColor = '#d1d5db', 200); }
        };

        function canMove() {
            let nx = kang.x, ny = kang.y;
            if (kang.dir === 0) ny--; if (kang.dir === 1) nx++; if (kang.dir === 2) ny++; if (kang.dir === 3) nx--;
            const lim = APP_MODE === 'GAME' ? LEVELS[currentLevelIdx].grid : GRID_SIZE;
            if (nx < 0 || nx >= lim || ny < 0 || ny >= lim) return false;
            if (APP_MODE === 'GAME' && LEVELS[currentLevelIdx].walls.some(w => w.x === nx && w.y === ny)) return false;
            return true;
        }

        function checkWin() {
            if (APP_MODE !== 'GAME') return false;
            const lvl = LEVELS[currentLevelIdx];
            if (kang.x === lvl.goal.x && kang.y === lvl.goal.y) {
                document.getElementById('victoryModal').classList.remove('hidden');
                abortController = true; return true;
            } return false;
        }

        window.runProgram = async () => {
            if(isRunning) return;
            if(APP_MODE==='GAME') { kang = {...LEVELS[currentLevelIdx].start, trace:[]}; window.draw(); }
            procedures={}; abortController=false; document.getElementById('errorBox').classList.add('hidden');
            const btn=document.getElementById('btnRun');
            try {
                const code=document.getElementById('codeEditor').value;
                const tokens=code.replace(/\/\/.*$/gm,'').replace(/\[/g,' [ ').replace(/\]/g,' ] ').split(/\s+/).filter(t=>t.length>0);
                if(!tokens.includes('BEGIN') || !tokens.includes('END')) throw new Error("Lipseste BEGIN/END");
                let main=[], i=0;
                while(i<tokens.length) {
                    if(tokens[i].toUpperCase()==='PROCEDURA') { i++; const n=tokens[i].toUpperCase(); i++; const b=extractBlock(tokens,i+1); procedures[n]=b.c; i=b.i; } 
                    else { main.push(tokens[i]); i++; }
                }
                const s=main.findIndex(t=>t.toUpperCase()==='BEGIN'); const e=main.findIndex(t=>t.toUpperCase()==='END');
                isRunning=true; btn.innerText="⏳ ...";
                await executeTokens(main.slice(s+1,e));
                if(!abortController) btn.innerText="▶ EXECUTĂ";
            } catch(e) { document.getElementById('errorBox').innerText = e.message; document.getElementById('errorBox').classList.remove('hidden'); btn.innerText="▶ EXECUTĂ"; }
            isRunning=false;
        };

        async function executeTokens(tokens) {
            let i=0;
            while(i<tokens.length) {
                if(abortController) return;
                const c=tokens[i].toUpperCase();
                if(c==='PAS') { window.move('pas'); await sleep(speed); }
                else if(c==='ROTIRE') { kang.dir=(kang.dir+1)%4; window.draw(); await sleep(speed); }
                else if(c==='SALT') { window.move('salt'); await sleep(speed); }
                else if(c==='REPETA') { i++; const cnt=parseInt(tokens[i]); i++; const b=extractBlock(tokens,i+1); for(let k=0;k<cnt;k++) await executeTokens([...b.c]); i=b.i-1; }
                else if(c==='EXECUTA') { i++; const n=tokens[i].toUpperCase(); if(procedures[n]) await executeTokens([...procedures[n]]); }
                else if(c==='DACA') {
                    i++; i++; const bt=extractBlock(tokens,i+1); i=bt.i; let bf={c:[],i:i};
                    if(i<tokens.length && tokens[i].toUpperCase()==='ALTFEL') { i++; bf=extractBlock(tokens,i+1); i=bf.i; }
                    if (!canMove()) await executeTokens([...bt.c]); else await executeTokens([...bf.c]);
                    i--;
                } i++;
            }
        }

        function extractBlock(t,idx) { let d=1,c=[],i=idx; while(d>0 && i<t.length) { if(t[i]==='[') d++; if(t[i]===']') d--; if(d>0) c.push(t[i]); i++; } return {c:c,i:i}; }
        function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }
    </script>
